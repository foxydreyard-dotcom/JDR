/* V1.4.3 - ACCUEIL SANCTUAIRE CINÉMATIQUE */
#homeScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background:
    linear-gradient(rgba(4,8,20,.24),rgba(4,8,20,.48)),
    linear-gradient(#071023,#02040b);

  background-attachment:fixed;
}

#homeScreen::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,rgba(2,5,14,.28),transparent 20%,transparent 80%,rgba(2,5,14,.28)),
    linear-gradient(180deg,rgba(2,5,14,.12),transparent 28%,transparent 70%,rgba(2,5,14,.45));
}

.home-content{
  width:92%;
  max-width:520px;
  position:relative;
  z-index:2;
  padding:22px 18px 20px;
  border-radius:22px;
  background:linear-gradient(180deg,rgba(5,8,20,.16),rgba(5,8,20,.38));
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}

#homeScreen .moon{
  display:none;
}

#homeScreen .small-title{
  color:#f0d7a1;
  font-size:12px;
  letter-spacing:5px;
  text-transform:uppercase;
  text-shadow:0 2px 15px rgba(0,0,0,.9);
}

#homeScreen .main-title{
  margin:12px 0 6px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(48px,7vw,74px);
  letter-spacing:2px;
  color:#fff8ea;
  text-shadow:
    0 0 16px rgba(255,235,190,.55),
    0 3px 24px rgba(0,0,0,.95);
}

#homeScreen .subtitle{
  color:#d9d4d1;
  margin:0 0 28px;
  text-shadow:0 2px 14px rgba(0,0,0,.9);
}

#homeScreen .menu{
  display:flex;
  flex-direction:column;
  gap:11px;
}

#homeScreen .menu button{
  width:100%;
  padding:15px 17px;
  border-radius:10px;
  border:1px solid rgba(222,187,123,.45);
  color:#f9f3e8;
  background:linear-gradient(135deg,rgba(14,17,29,.82),rgba(10,12,22,.78));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.03),
    0 8px 25px rgba(0,0,0,.30);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  transition:.2s ease;
}

#homeScreen .menu button:hover{
  transform:translateY(-2px);
  border-color:rgba(255,205,120,.9);
  box-shadow:
    0 0 16px rgba(225,158,70,.20),
    0 10px 28px rgba(0,0,0,.38);
}

#homeScreen .menu .primary{
  color:#fff5e6;
  font-weight:800;
  background:linear-gradient(135deg,rgba(112,28,22,.88),rgba(54,16,18,.88));
  border-color:rgba(255,168,92,.85);
  box-shadow:
    0 0 20px rgba(211,73,32,.25),
    inset 0 0 14px rgba(255,184,105,.08);
}

#homeScreen .version{
  margin-top:24px;
  color:#e0c28c;
  font-size:10px;
  letter-spacing:3px;
  text-shadow:0 2px 10px rgba(0,0,0,.95);
}

@media(max-width:700px){
  #homeScreen{
    background-attachment:scroll;
    background-position:center center;
  }
  .home-content{
    width:94%;
    padding:16px 12px;
    background:linear-gradient(180deg,rgba(5,8,20,.18),rgba(5,8,20,.48));
  }
  #homeScreen .main-title{
    font-size:clamp(40px,12vw,58px);
  }
  #homeScreen .menu button{
    padding:14px 15px;
  }
}

/* V1.0 - COMBAT VISUEL */
.combat-stage{
  grid-column:span 3;
  padding:22px;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(18,25,45,.98),rgba(9,13,24,.98));
}
.combat-stage-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.combat-stage-grid{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:18px;
}
.fighter-zone{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
}
.fighter-card{
  padding:14px;
  border-radius:15px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#171f34,#0e1424);
  transition:.18s;
}
.fighter-card.active{
  border-color:#8898ff;
  box-shadow:0 0 0 1px rgba(136,152,255,.25),0 0 30px rgba(100,120,255,.12);
}
.fighter-card.targeted{
  outline:2px solid #efcf78;
}
.fighter-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.fighter-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222c4b;
  border:1px solid #50608e;
}
.fighter-avatar img{width:100%;height:100%;object-fit:cover}
.fighter-name{font-weight:800}
.fighter-type{font-size:11px;color:var(--muted)}
.fighter-bars{display:flex;flex-direction:column;gap:8px}
.smallbar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.smallbar{height:9px;border-radius:999px;overflow:hidden;background:#070a12;border:1px solid #27304a}
.smallbar>div{height:100%}
.hpfill{background:linear-gradient(90deg,#7f2632,#ef5f6c)}
.spfill{background:linear-gradient(90deg,#454786,#9ba7ff)}
.fighter-actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:12px;
}
.fighter-actions button{
  padding:9px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#141c31;
  color:white;
}
.fighter-actions .attack-btn{background:#32161c}
.fighter-actions .heal-btn{background:#123022}
.fighter-actions .target-btn{background:#2c2947}
.combat-console{
  padding:15px;
  border-radius:15px;
  border:1px solid var(--border);
  background:#0b1120;
  position:sticky;
  top:18px;
  height:max-content;
}
.combat-console h3{margin-top:0}
.console-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.console-grid label{margin:0}
.console-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.console-actions button{
  padding:11px;
  border-radius:9px;
  border:1px solid var(--border);
  color:white;
  background:#151c31;
}
.console-actions .big-attack{background:#4a1d25}
.console-actions .big-heal{background:#17432d}
.turn-banner{
  margin-bottom:12px;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #4f5f9a;
  background:#151d38;
  color:#dfe4ff;
}
.quick-roll{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}
.quick-roll button{
  padding:8px 10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#121a2e;
  color:white;

.mobile-bottom-bar{
  display:none;
}
@media(max-width:950px){
  .combat-stage{grid-column:span 2}
  .combat-stage-grid{grid-template-columns:1fr}
  .combat-console{position:static}
}
@media(max-width:700px){
  body{padding-bottom:68px}
  .combat-stage{grid-column:span 1}
  .fighter-zone{grid-template-columns:1fr}
  .mobile-bottom-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:300;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:#0b1020;
    border-top:1px solid var(--border);
  }
  .mobile-bottom-bar button{
    border:0;
    border-right:1px solid var(--border);

    color:white;
    padding:12px 6px;
    font-size:12px;
  }
  .combat-stage-header{align-items:flex-start}
  .console-grid,.console-actions{grid-template-columns:1fr}
}

/* V1.4.6 - MP4 COMPRESSE POUR GITHUB PAGES */
#homeBgVideo{

/* V1.4.7 - DECOR LUNAIRE SUR LES ECRANS INTERNES */
#innerDecor{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}
#homeScreen:not(.hidden) ~ #innerDecor{
  display:none;
}
.inner-moon{
  position:absolute;
  top:28px;
  right:34px;
  width:108px;
  height:108px;
  border-radius:50%;
  background:
    radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 5%,transparent 6%),
    radial-gradient(circle at 62% 58%,rgba(155,166,215,.22) 0 8%,transparent 9%),
    radial-gradient(circle at 68% 34%,rgba(155,166,215,.18) 0 6%,transparent 7%),
    radial-gradient(circle,#f8f9ff 0%,#dfe5ff 58%,#aab7ea 100%);
  box-shadow:
    0 0 18px rgba(235,240,255,.95),
    0 0 48px rgba(153,169,255,.55),
    0 0 92px rgba(100,118,205,.30);
  opacity:.9;
}
.inner-moon::after{
  content:"";
  position:absolute;
  inset:-16px;
  border-radius:50%;
  border:1px solid rgba(211,219,255,.15);
  box-shadow:0 0 35px rgba(166,180,255,.16);
}
.moon-drop{
  position:absolute;
  top:-40px;
  width:8px;
  height:22px;
  border-radius:50% 50% 58% 58%;
  background:linear-gradient(180deg,#ffffff 0%,#cfd8ff 55%,rgba(139,158,255,.2) 100%);
  box-shadow:0 0 10px rgba(213,223,255,.85),0 0 22px rgba(141,160,255,.42);
  opacity:0;
  animation:moonDropFall var(--dur,9s) linear var(--delay,0s) infinite;
}
.moon-drop::after{
  content:"";
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:white;
  left:50%;
  bottom:-8px;
  transform:translateX(-50%);
  box-shadow:0 0 8px white;
}
@keyframes moonDropFall{
  0%{transform:translate3d(0,-40px,0) scale(.7);opacity:0}
  8%{opacity:.78}
  70%{opacity:.54}
  100%{transform:translate3d(var(--drift,22px),110vh,0) scale(1);opacity:0}
}
.kitsune-runner{
  position:absolute;
  left:-120px;
  bottom:var(--bottom,55px);
  font-size:var(--size,38px);
  filter:drop-shadow(0 0 10px rgba(255,183,93,.28));
  opacity:.72;
  transform:scaleX(1);
  animation:kitsuneRun var(--run,24s) linear var(--delay,0s) infinite;
}
.kitsune-runner.reverse{
  left:auto;
  right:-120px;
  transform:scaleX(-1);
  animation-name:kitsuneRunReverse;
}
@keyframes kitsuneRun{
  0%{left:-120px;transform:translateY(0) scaleX(1)}
  12%{transform:translateY(-4px) scaleX(1)}
  25%{transform:translateY(1px) scaleX(1)}
  38%{transform:translateY(-5px) scaleX(1)}
  50%{transform:translateY(0) scaleX(1)}
  100%{left:calc(100vw + 120px);transform:translateY(-2px) scaleX(1)}
}
@keyframes kitsuneRunReverse{
  0%{right:-120px;transform:translateY(0) scaleX(-1)}
  18%{transform:translateY(-4px) scaleX(-1)}
  35%{transform:translateY(1px) scaleX(-1)}
  55%{transform:translateY(-5px) scaleX(-1)}
  100%{right:calc(100vw + 120px);transform:translateY(0) scaleX(-1)}
}
.screen{
  position:relative;
  z-index:2;
}
#homeScreen{z-index:2}
@media(max-width:700px){
  .inner-moon{
    width:76px;
    height:76px;
    top:18px;
    right:16px;
    opacity:.72;
  }
  .kitsune-runner{font-size:30px}
}
@media(prefers-reduced-motion:reduce){
  .moon-drop,.kitsune-runner{animation:none!important;display:none}
}


/* V1.4.8 FIX - SANCTUAIRE VIVANT */
.kitsune-runner{display:none!important}

#sanctuaryLifeScene{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:300px;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
  opacity:.82;
}

/* marches du sanctuaire */
#sanctuaryLifeScene .stairs{
  position:absolute;
  left:50%;
  bottom:-6px;
  width:min(760px,76vw);
  height:220px;
  transform:translateX(-50%);
  clip-path:polygon(28% 0,72% 0,88% 100%,12% 100%);
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(89,102,150,.10) 0 14px,
      rgba(135,151,214,.28) 14px 17px,
      rgba(31,39,67,.22) 17px 31px
    );
  filter:drop-shadow(0 -10px 22px rgba(112,132,220,.08));
}

/* torii léger au-dessus des marches */
#sanctuaryLifeScene .mini-torii{
  position:absolute;
  left:50%;
  bottom:190px;
  width:310px;
  height:92px;
  transform:translateX(-50%);
  opacity:.30;
}
#sanctuaryLifeScene .mini-torii::before,
#sanctuaryLifeScene .mini-torii::after{
  content:"";
  position:absolute;
  top:12px;
  width:18px;
  height:80px;
  background:#8a1e28;
  border-radius:2px;
}
#sanctuaryLifeScene .mini-torii::before{left:34px}
#sanctuaryLifeScene .mini-torii::after{right:34px}
#sanctuaryLifeScene .mini-torii span{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:14px;
  background:#9b232f;
  border-radius:3px;
  box-shadow:0 22px 0 #771923;
}

/* animaux */
.life-animal{
  position:absolute;
  width:78px;
  height:58px;
  pointer-events:none;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.30));
}
.life-animal svg{width:100%;height:100%;overflow:visible}
.life-animal .body-bob{
  transform-origin:center;
  animation:lifeBob .55s ease-in-out infinite alternate;
}
.life-animal .tail{
  transform-origin:55px 33px;
  animation:lifeTail 1s ease-in-out infinite alternate;
}
.life-animal .ear{
  transform-origin:center;
  animation:lifeEar 2.7s ease-in-out infinite;
}
@keyframes lifeBob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes lifeTail{from{transform:rotate(-7deg)}to{transform:rotate(10deg)}}
@keyframes lifeEar{
  0%,80%,100%{transform:rotate(0)}
  84%{transform:rotate(-7deg)}
  90%{transform:rotate(3deg)}
}

/* blanc : descend les marches, puis file à droite */
#whiteKitsune{
  left:50%;
  bottom:188px;
  opacity:0;
  animation:whiteJourney 18s linear infinite;
}
@keyframes whiteJourney{
  0%{left:50%;bottom:188px;opacity:0;transform:translateX(-50%) scale(.68)}
  5%{opacity:.95}
  18%{left:50.5%;bottom:150px;transform:translateX(-50%) scale(.76)}
  32%{left:51.5%;bottom:112px;transform:translateX(-50%) scale(.84)}
  44%{left:53%;bottom:72px;transform:translateX(-50%) scale(.92)}
  53%{left:56%;bottom:34px;transform:translateX(-50%) scale(1)}
  93%{left:108%;bottom:24px;opacity:.9;transform:translateX(-50%) scale(1.03)}
  100%{left:112%;bottom:24px;opacity:0;transform:translateX(-50%) scale(1.03)}
}

/* orange : monte les marches */
#orangeFox{
  left:28%;
  bottom:16px;
  opacity:0;
  transform:scaleX(-1);
  animation:orangeClimb 23s linear infinite 2s;
}
@keyframes orangeClimb{
  0%{left:27%;bottom:14px;opacity:0;transform:scaleX(-1) scale(1)}
  6%{opacity:.95}
  24%{left:37%;bottom:42px;transform:scaleX(-1) scale(.94)}
  46%{left:45%;bottom:84px;transform:scaleX(-1) scale(.86)}
  68%{left:49%;bottom:132px;transform:scaleX(-1) scale(.78)}
  88%{left:50%;bottom:177px;opacity:.82;transform:scaleX(-1) scale(.70)}
  100%{left:50%;bottom:202px;opacity:0;transform:scaleX(-1) scale(.64)}
}

/* gris/noir : arrive, s'assoit, se toilette, repart */
#grayKitsune{
  left:-90px;
  bottom:40px;
  opacity:0;
  animation:grayRoutine 27s linear infinite 5s;
}
#grayKitsune .paw{
  transform-origin:31px 38px;
  animation:groomPaw 1s ease-in-out infinite;
  opacity:0;
}
#grayKitsune.grooming .paw{opacity:1}
@keyframes grayRoutine{
  0%{left:-90px;opacity:0}
  5%{opacity:.92}
  23%{left:18%}
  31%{left:20%}
  68%{left:20%;opacity:.92}
  76%{left:22%}
  96%{left:104%;opacity:.86}
  100%{left:108%;opacity:0}
}
@keyframes groomPaw{
  0%,100%{transform:rotate(0deg) translateY(0)}
  50%{transform:rotate(-42deg) translateY(-5px)}
}

/* petit chat marron devant les marches */
#brownCat{
  left:-80px;
  bottom:9px;
  opacity:0;
  animation:catDash 15s linear infinite 8s;
}
#brownCat .body-bob{animation-duration:.35s}
#brownCat .tail{animation-duration:.55s}
@keyframes catDash{
  0%{left:-80px;opacity:0;transform:scale(.72)}
  5%{opacity:.95}
  96%{left:104%;opacity:.92;transform:scale(.72)}
  100%{left:108%;opacity:0;transform:scale(.72)}
}

@media(max-width:800px){
  #sanctuaryLifeScene{height:220px;opacity:.68}
  #sanctuaryLifeScene .stairs{width:94vw;height:165px}
  #sanctuaryLifeScene .mini-torii{bottom:140px;transform:translateX(-50%) scale(.76)}
  .life-animal{width:60px;height:46px}
}
@media(prefers-reduced-motion:reduce){
  #sanctuaryLifeScene{display:none}
}

   ========================================================= */
@media (max-width: 760px){

  html,body{
    width:100%!important;
    max-width:100%!important;
    overflow-x:hidden!important;
  }

    min-height:100dvh!important;

  /* Écrans principaux plein téléphone */

  #charactersScreen,
  #characterScreen,
  #gamesScreen,
  #mjScreen,
  #multiplayerScreen,
  #settingsScreen{
    width:100%!important;
    max-width:none!important;
    margin:0!important;
    padding:14px 12px 28px!important;
    min-height:100dvh!important;
    border-radius:0!important;
    overflow:visible!important;
  }

  /* Sur téléphone, on simplifie la grande silhouette spéciale
     pour éviter les découpes hors écran. */
  #charactersScreen,
  #gamesScreen,
  #mjScreen,
  #multiplayerScreen{
    background-image:none!important;
    background:
      linear-gradient(160deg,rgba(8,16,38,.60),rgba(4,10,27,.64))!important;
    border:1px solid rgba(103,115,214,.65)!important;
    border-radius:20px!important;
    box-shadow:
      inset 0 0 0 1px rgba(110,126,255,.08),
      0 12px 28px rgba(0,0,0,.18)!important;

  .topbar{
    display:flex!important;
    flex-wrap:wrap!important;
    align-items:center!important;
    gap:10px!important;
    margin-bottom:16px!important;
  }

  .topbar-title{
    flex:1 1 calc(100% - 120px)!important;
    min-width:0!important;
  }

  .topbar h1{
    font-size:30px!important;
    line-height:1.05!important;
    word-break:break-word!important;
  }

  .eyebrow{
    font-size:9px!important;
    letter-spacing:2px!important;
  }

  .back-button,
  .save-button,

    padding:10px 13px!important;
    font-size:13px!important;

  .screen-sitter,
  .sitter-video{
    display:block!important;
    position:absolute!important;

/* V1.10.0 — binding robuste du bouton Créer */
(function bindCreateCharacterButton(){
  const bind=()=>{
    const btn=document.getElementById("createCharacterBtn");
    if(!btn)return;
    btn.onclick=null;
    btn.addEventListener("click",(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      createCharacter();
    },false);
  };
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",bind,{once:true});
  }else{
    bind();
  }
})();
